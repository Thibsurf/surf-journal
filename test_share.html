<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test — Carte spot partageable (PROMPT 4)</title>
<style>
  body{margin:0;background:#0a1628;color:#e8eef4;font-family:'DM Sans',system-ui,sans-serif;padding:20px;}
  h1{font-size:18px;font-weight:600;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0;}
  button,label{font-size:13px;}
  button{background:rgba(79,163,199,.15);border:1px solid #4fa3c7;color:#4fa3c7;padding:6px 14px;border-radius:8px;cursor:pointer;}
  canvas{width:min(540px,92vw);height:auto;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:#0a1628;margin-top:12px;}
  pre{background:#0d1f3c;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px;white-space:pre-wrap;font-size:13px;}
  .muted{color:#7a94aa;font-size:12px;}
</style>
</head>
<body>
  <h1>📤 Test carte spot partageable</h1>
  <p class="muted">Rendu réel de <code>assets/share-card.js</code> (le même code que la prod). Ouvre ce fichier dans un navigateur.</p>
  <div class="row">
    <label><input type="checkbox" id="cb-bms" checked> BMS actif</label>
    <label><input type="checkbox" id="cb-bms-red"> BMS rouge (coup de vent)</label>
    <label>Score <input type="range" id="rg-score" min="0" max="5" value="4"></label>
    <button onclick="render()">↻ Re-générer</button>
    <button onclick="dl()">⬇ Télécharger PNG</button>
  </div>
  <pre id="summary">…</pre>
  <canvas id="cv" width="1080" height="1080"></canvas>

<script src="assets/share-card.js"></script>
<script>
function buildData(){
  var bmsOn = document.getElementById('cb-bms').checked;
  var bmsRed = document.getElementById('cb-bms-red').checked;
  var score = +document.getElementById('rg-score').value;
  var labels = ['Nul','Médiocre','Passable','Bien','Très bien','Excellent'];
  var now = Date.now();
  return {
    spotName:'Ricaudy', ts: now,
    hs:1.0, T:11, dir:135, hs2:0.4, tot:1.2, ws:8, wg:12, wd:300, p:21,
    score:score, scoreLabel:labels[score],
    onshoreLimit:45, offshoreMin:135,
    tide:{ nextPM:{ms:now+3*3600e3, h:1.45}, nextBM:{ms:now+9*3600e3, h:0.35}, rising:true, stateLabel:'mi-marée montante' },
    bms: bmsOn ? { active:true, niveau:'cote', nature:'Avis de grand frais', severity: bmsRed?'red':'orange' } : null
  };
}
function render(){
  var d = buildData();
  ShareCard.draw(document.getElementById('cv'), d);
  document.getElementById('summary').textContent = ShareCard.buildSummary(d).textLine;
}
function dl(){
  document.getElementById('cv').toBlob(function(b){
    var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='surf-ricaudy-test.png'; a.click();
  },'image/png');
}
// Attendre le chargement des polices web pour un rendu fidèle, puis dessiner.
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render); else render();
render();
</script>
</body>
</html>
