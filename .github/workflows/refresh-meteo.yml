name: Refresh meteo.nc token

env:
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install bot deps
        working-directory: ./bot
        run: npm install

      - name: Run bot
        working-directory: ./bot
        run: node refresh.js
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
