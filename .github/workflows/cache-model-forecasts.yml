name: Cache model forecasts

# 3x/jour (passé de 2x à 3x — demandé explicitement par l'utilisateur : le site
# ne couvre que Nouméa et ses alentours, un rayon restreint, donc le coût de
# rafraîchir plus souvent reste faible ; le run AROME s'était retrouvé "pas
# encore chargé" trop souvent avec seulement 2 passages/jour). Décalé de 15 min
# après cache-marc.yml (0 1,9,17) pour ne pas taper les mêmes minutes exactes.
on:
  schedule:
    - cron: '15 1,9,17 * * *'
  workflow_dispatch: {}

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch + archive model forecasts
        run: node .github/scripts/cache-model-forecasts.mjs

  # AROME Outre-Mer Nouvelle-Calédonie : décodage direct des GRIB2 Météo-France
  # (meteofetch, GPL-2.0 — isolé dans ingestion/, cf. ingestion/requirements.txt).
  # Job Python séparé du job Node ci-dessus, même planning. Le run AROME réel
  # (freq_update=3h) est retrouvé dynamiquement par le script (latence de
  # publication observée jusqu'à ~12h sur ce domaine Outre-Mer) — inutile de
  # caler le cron sur une heure précise de run.
  arome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt
      - name: Fetch + archive AROME OM NC
        run: python ingestion/fetch_arome.py

  # MFWAM (Météo-France) via Copernicus Marine — remplace le relais Open-Meteo
  # `meteofrance_wave` pour la clé modèle `mf` : mêmes runs/même modèle, mais en
  # direct, avec la vraie résolution (0,083°, ~9 km) et de vraies partitions
  # AVEC direction (mer du vent + houle primaire/secondaire), cf. le docstring
  # de fetch_mfwam.py. Nécessite un compte Copernicus Marine gratuit — secrets
  # du repo à créer par l'utilisateur (Settings → Secrets and variables →
  # Actions) : COPERNICUSMARINE_SERVICE_USERNAME, COPERNICUSMARINE_SERVICE_PASSWORD.
  mfwam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt
      - name: Fetch + archive MFWAM (Copernicus Marine)
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python ingestion/fetch_mfwam.py

  # ECMWF Open Data (IFS-HRES + AIFS-single) — remplace le relais Windguru
  # (id_model=118/117, accès non officiel pour les spots NC, ne couvrait que
  # ~7 spots) : en direct depuis data.ecmwf.int, gratuit, sans clé (CC-BY-4.0).
  # Grille réelle 0,25° (~28 km), 25 steps (0-144h par 6h, cf. le docstring de
  # fetch_ecmwf.py pour le détail de ce choix) x 2 modèles ≈ 500 Mo/run — job
  # plus long que les autres, sans commune mesure avec le volume AROME/MFWAM.
  ecmwf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt
      - name: Fetch + archive ECMWF Open Data (IFS + AIFS-single)
        run: python ingestion/fetch_ecmwf.py
